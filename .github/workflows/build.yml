# 用最新版 LuaTeX 排出 PDF，成品放進 artifacts。
#
# 跑在 texlive/texlive:latest 裡 —— 該映像每日自 TeX Live 上游重建，
# 所以「最新版」不是釘死的版本號，是當天的 LuaTeX。
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lualatex:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    env:
      # 版式引擎（ltc-guji 文檔類）。取 main 而非最新 release：
      # v0.4.1 尚無「連續兩個正文塊不叠印」等修正，本書排不出來。
      LUATEX_CN_REF: main
      # 正文字體三支互補，缺一即缺字。URL 與 SHA-256 取自 luatex-cn 的
      # scripts/font-manifest.json；AR PL UKai 取 Debian 的字體包。
      #   TW-Kai         URO 99.7% + Ext-A 100%，正文絕大多數字
      #   TW-Kai-Ext-B   Ext-B 100% + Ext-C 98.6%，10 個考訂本字共 50 處
      #   AR PL UKai TW  只為「龯」U+9FAF 一處 —— 它落在 TW-Kai 缺的那 0.3% URO 裡
      TW_KAI_URL: https://raw.githubusercontent.com/free-fonts-npm/TW-CNS11643-Fonts/de5bd2e37371798f996bac11ea8cf9d3a411749e/2026-05-05/Fonts_Kai/TW-Kai-98_1.ttf
      TW_KAI_SHA256: c206333edcc3c8c86ee547da4c78ad1c8f7ec2670a2b550a768532258f75806a
      TW_KAI_EXTB_URL: https://raw.githubusercontent.com/free-fonts-npm/TW-CNS11643-Fonts/de5bd2e37371798f996bac11ea8cf9d3a411749e/2026-05-05/Fonts_Kai/TW-Kai-Ext-B-98_1.ttf
      TW_KAI_EXTB_SHA256: 562d19fde56dfa52a3fed88a53154698e1d66e4b9c0a1faa9ba4ffa98e9d7a92
      UKAI_DEB_URL: https://deb.debian.org/debian/pool/main/f/fonts-arphic-ukai/fonts-arphic-ukai_0.2.20080216.2-5_all.deb
      UKAI_DEB_SHA256: b9db73184895b067f7911f9adbf3b137df99c2d4ec5425b4ad779a9834b7110b
      UKAI_TTC_SHA256: cfc758e69386a21bade8cb3b373fda20d7f2fac6e8904ced2ded98588b63e274

    steps:
      - name: 記下 LuaTeX 版本
        run: |
          luatex --version | head -2
          lualatex --version | head -2

      - name: 補齊 curl / git / ar / pikepdf
        run: |
          # ar 與 xz 用來拆 Debian 的字體包；pikepdf 用來加書籤。
          # 走 apt 而非 pip：Debian 的 python3 是 externally-managed（PEP 668），
          # pip install 會被擋。
          apt-get update
          apt-get install -y --no-install-recommends \
            curl git ca-certificates binutils xz-utils python3 python3-pikepdf

      - uses: actions/checkout@v4

      - name: 裝 luatex-cn
        run: |
          set -eux
          TEXMFHOME="$(kpsewhich -var-value TEXMFHOME)"
          echo "TEXMFHOME=$TEXMFHOME" >> "$GITHUB_ENV"
          # 必須是 tex/lualatex/：放進 tex/latex/ 時 .lua 找不著，
          # 版式引擎靜默退化，正文塊一結束就 \prevdepth 報錯
          mkdir -p "$TEXMFHOME/tex/lualatex"
          # 只取 tex/：整倉庫連範例 PDF 有 94 MB，稀疏檢出只 2.5 MB
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "$LUATEX_CN_REF" https://github.com/open-guji/luatex-cn.git /tmp/luatex-cn
          git -C /tmp/luatex-cn sparse-checkout set tex
          git -C /tmp/luatex-cn rev-parse --short HEAD
          cp -r /tmp/luatex-cn/tex "$TEXMFHOME/tex/lualatex/luatex-cn"
          texhash "$TEXMFHOME" || true
          kpsewhich ltc-guji.cls

      - name: 裝字體
        run: |
          set -eux
          FONTDIR="$TEXMFHOME/fonts/truetype/luatex-cn"
          mkdir -p "$FONTDIR"

          curl -fsSL -o "$FONTDIR/TW-Kai-98_1.ttf" "$TW_KAI_URL"
          echo "$TW_KAI_SHA256  $FONTDIR/TW-Kai-98_1.ttf" | sha256sum -c -

          curl -fsSL -o "$FONTDIR/TW-Kai-Ext-B-98_1.ttf" "$TW_KAI_EXTB_URL"
          echo "$TW_KAI_EXTB_SHA256  $FONTDIR/TW-Kai-Ext-B-98_1.ttf" | sha256sum -c -

          curl -fsSL -o /tmp/ukai.deb "$UKAI_DEB_URL"
          echo "$UKAI_DEB_SHA256  /tmp/ukai.deb" | sha256sum -c -
          ( cd /tmp && ar x ukai.deb data.tar.xz \
            && tar xf data.tar.xz ./usr/share/fonts/truetype/arphic/ukai.ttc )
          cp /tmp/usr/share/fonts/truetype/arphic/ukai.ttc "$FONTDIR/"
          echo "$UKAI_TTC_SHA256  $FONTDIR/ukai.ttc" | sha256sum -c -

          luaotfload-tool --update --force || true

      # 兩版一起排：黑白版是定本，彩色版是四庫全書原本的朱欄墨字。
      # 差別只在文檔類選項與底色，版式、葉數、書籤完全相同。
      - name: 派生彩色版
        run: python3 tools/make_colored.py 欽定儀象考成.tex -o 欽定儀象考成-彩色.tex

      - name: 排版
        run: |
          set -eu
          for f in 欽定儀象考成 欽定儀象考成-彩色; do
            echo "::group::$f"
            lualatex -interaction=nonstopmode -halt-on-error "$f.tex"
            echo "::endgroup::"
          done

      # 三項靜默失敗轉為硬錯誤，兩版各查一遍：
      #   缺字型時 LuaTeX 照樣編譯成功，字直接消失，只留 Missing character 警告
      #   葉數必須是 875
      #   書籤 37 條 = 序 + 奏議 + 職名 + 目録 + 提要 + 卷首上下 + 卷一至卷三十
      - name: 加書籤並查驗
        run: |
          set -eu
          for f in 欽定儀象考成 欽定儀象考成-彩色; do
            echo "::group::$f"
            if grep -i "Missing character" "$f.log"; then
              echo "::error::$f 的日誌裡有 Missing character，PDF 有字沒排出來"
              exit 1
            fi
            PAGES=$(sed -n 's/.*Output written on .*(\([0-9]*\) pages.*/\1/p' "$f.log")
            echo "排出 $PAGES 葉，無缺字"
            test "$PAGES" = 875

            python3 tools/pdf_bookmarks.py "$f.pdf" "$f-bookmarks.txt"
            N=$(python3 -c "import pikepdf; p=pikepdf.open('$f.pdf'); \
                print(len(list(p.open_outline().root)), len(p.pages))")
            echo "書籤數 / 葉數：$N"
            test "$N" = "37 875"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 欽定儀象考成-pdf
          path: |
            欽定儀象考成.pdf
            欽定儀象考成-彩色.pdf
            欽定儀象考成.log
            欽定儀象考成-彩色.log
          if-no-files-found: warn
          retention-days: 30
